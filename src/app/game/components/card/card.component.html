<button class="card-button" [class.mine]="mine" (click)="click()" [disabled]="!enabled">
  <div *ngIf="card">
    <div *ngIf="revealed" class="value-wrapper flex-column" fxLayoutAlign="start stretch">
      <div class="flex-10 flex-center" fxLayoutAlign="start center">
        <span>{{label}}</span>
      </div>
      <div class="flex-100 flex-center" fxLayoutAlign="center">
        <span>{{label}}</span>
      </div>
      <div class="flex-10 flex-center" fxLayoutAlign="end center">
        <span>{{label}}</span>
      </div>
    </div>
    <div *ngIf="!revealed">
      <img src="assets/logo_40x40.png" />
    </div>
  </div>
  <div *ngIf="!card">
    <img class="greyed" src="assets/logo_40x40.png" />
  </div>
</button>
