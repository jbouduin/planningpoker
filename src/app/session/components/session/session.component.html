<mat-sidenav-container>
  <mat-sidenav #sidenav opened="true" mode="side">
    <session-member-panel [team]="team"></session-member-panel>
  </mat-sidenav>
  <mat-sidenav-content>
    <!-- Game board -->
    <div>
      <div class="toggle-container">
        <button (click)="sidenav.toggle()" class="toggle">T</button>
      </div>
      <div class="game-container">
        <session-team-header [team]="team"></session-team-header>
        <!-- TODO Played cards component poker table-->
        <mat-card>
          <div class="flex-row flex-wrap estimations mat-card-inner-container">
            <ng-container *ngFor="let estimation of estimations">
              <div class="flex-column">
                <session-card [card]="estimation.card" [revealed]="estimation.revealed"
                  [enabled]="estimation.member.me && canEstimate" [mine]="estimation.member.me"
                  (cardClicked)="withdraw()">
                </session-card>
                <div class="flex-center" [class.mine]="estimation.member.me">
                  <div class="nick">
                    <span>{{estimation.member.me ? 'me' : estimation.member.nick}}</span>
                  </div>
                </div>
              </div>
            </ng-container>
            <!-- Missing estimations -->
            <ng-container *ngFor="let participant of participantsWithoutEstimation">
              <div class="flex-column">
                <session-card [enabled]="false" [mine]="participant.me" (cardClicked)="withdraw()">
                </session-card>
                <div class="flex-center" [class.mine]="participant.me">
                  <div class="nick not-estimated">
                    <span>{{participant.me ? meLabel : participant.nick}}</span>
                  </div>
                </div>
              </div>
            </ng-container>
          </div>
        </mat-card>
        <!-- TODO Available cards component my-hand -->
        <mat-card>
          <div class="flex-row flex-wrap mat-card-inner-container">
            <div class="list-group-item" *ngFor="let card of availableCards">
              <session-card [card]="card" [enabled]="canEstimate && enabled" [isAvailableCard]="true"
                (cardClicked)="estimate($event)"></session-card>
            </div>
          </div>
        </mat-card>
        <!-- Buttons -->
        <mat-card>
          <!-- TODO  component poker buttons -->
          <div class="flex-row mat-card-inner-container">
            <div *ngIf="showStart" class="game-button">
              <button mat-stroked-button color="primary" (click)="start()" [disabled]="!enabled">
                {{startButtonLabel}}
              </button>
            </div>
            <div *ngIf="showReveal" class="game-button">
              <button mat-stroked-button color="primary" (click)="reveal()" [disabled]="!enabled">
                {{revealButtonLabel}}
              </button>
            </div>
            <div *ngIf="showForceReveal" class="game-button">
              <button mat-stroked-button color="primary" (click)="reveal()" [disabled]="!enabled">
                {{forceRevealButtonLabel}}
              </button>
            </div>
            <!-- TODO  component member buttons -->
            <div class="game-button">
              <button mat-stroked-button color="primary" (click)="leave()" [disabled]="!enabled">
                {{leaveLabel}}
              </button>
            </div>
            <div *ngIf="showDisconnect" class="game-button">
              <button mat-stroked-button color="warning" (click)="disconnect()" [disabled]="!enabled">
                {{pauseButtonLabel}}
              </button>
            </div>
          </div>
        </mat-card>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
