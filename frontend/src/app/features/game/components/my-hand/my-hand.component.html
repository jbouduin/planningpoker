<mat-card>
  <div class="my-hand mat-card-inner-container">
    <div *ngFor="let card of gameSvc.cards()">
      <app-card
        [card]="card"
        [enabled]="canEstimate()"
        [isAvailableCard]="true"
        (cardClicked)="cardClicked($event)"
      ></app-card>
    </div>
  </div>
</mat-card>
