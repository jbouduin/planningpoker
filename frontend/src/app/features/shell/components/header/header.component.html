<div class="header-container">
  <div *ngIf="canNavigate">
    <button mat-button routerLink="/" routerLinkActive="active">
      <mat-icon>home</mat-icon>
      {{ ROUTE_LABEL_HOME | translate }}
    </button>
    <button mat-button routerLink="legal" routerLinkActive="active">
      <mat-icon>gavel</mat-icon>
      {{ ROUTE_LABEL_LEGAL | translate }}
    </button>
    <button mat-button routerLink="privacy" routerLinkActive="active">
      <mat-icon>security</mat-icon>
      {{ ROUTE_LABEL_PRIVACY | translate }}
    </button>
  </div>
  <div class="header-right">
    <div class="version-text">{{ version }}</div>
    <app-language-selector></app-language-selector>
  </div>
</div>
