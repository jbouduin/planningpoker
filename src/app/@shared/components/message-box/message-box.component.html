<h1 mat-dialog-title>{{title}}</h1>
<div mat-dialog-content>
  {{text}}
</div>
<div mat-dialog-actions>
  <button id="cancel-button" mat-button *ngIf="showCancelButton" (click)="cancel()">{{cancelButtonLabel}}</button>
  <button id="submit-button" mat-button [mat-dialog-close]="true">{{okButtonLabel}}</button>
</div>
