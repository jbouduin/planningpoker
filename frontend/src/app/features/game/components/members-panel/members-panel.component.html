<div class="side-nav-container">
  <!-- Scrum-master -->
  <div id="scrum-master" class="participants">
    <mat-card-title>{{ SCRUM_MASTER_LABEL | translate }}</mat-card-title>
    <mat-card-content *ngIf="memberPanelState().scrumMaster != null" class="participant-list">
      <app-member [member]="memberPanelState().scrumMaster!"></app-member>
    </mat-card-content>
  </div>
  <!-- Developers -->
  <div id="developers" class="participants">
    <mat-card-title>{{ DEVELOPERS_LABEL | translate }}</mat-card-title>
    <mat-card-content class="participant-list">
      <div *ngFor="let developer of memberPanelState().developers">
        <app-member [member]="developer"></app-member>
      </div>
    </mat-card-content>
  </div>
  <!-- Observers -->
  <div id="observers" class="participants">
    <mat-card-title>{{ OBSERVERS_LABEL | translate }}</mat-card-title>
    <mat-card-content class="participant-list">
      <div *ngFor="let observer of memberPanelState().observers">
        <app-member [member]="observer"></app-member>
      </div>
    </mat-card-content>
  </div>
  <!-- Leave and pause -->
  <div id="actions" class="participants">
    <mat-card>
      <button
        *ngIf="memberPanelState().leaveButtonMode === 'disband'"
        id="disband-button"
        mat-stroked-button
        color="primary"
        [disabled]="!canLeave()"
        (click)="disband()"
      >
        {{ DISBAND_LABEL | translate }}
      </button>
      <button
        *ngIf="memberPanelState().leaveButtonMode === 'leave'"
        id="leave-button"
        mat-stroked-button
        color="primary"
        [disabled]="!canLeave()"
        (click)="leave()"
      >
        {{ LEAVE_LABEL | translate }}
      </button>
      <button id="pause-button" [disabled]="!canPause()" mat-stroked-button color="primary" (click)="pause()">
        {{ PAUSE_LABEL | translate }}
      </button>
    </mat-card>
  </div>
</div>
