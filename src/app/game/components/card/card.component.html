<button class="card-button" (click)="click()">
  <div class="value-wrapper" fxLayout="column" fxLayoutAlign="start stretch">
    <div fxLayoutAlign="start center" fxFlex="10">
      <span>{{card.label}}</span>
    </div>
    <div fxLayoutAlign="center center" fxFlex>
      <span>{{card.label}}</span>
    </div>
    <div fxLayoutAlign="end center" fxFlex="10">
      <span>{{card.label}}</span>
    </div>
  </div>
</button>
