<div class="button-row">
  <div class="game-button">
    <button mat-stroked-button color="primary" (click)="clickLeave()" [disabled]="!enabled">
      {{leaveLabel}}
    </button>
  </div>
  <div class="game-button">
    <button mat-stroked-button color="warning" (click)="clickDisconnect()" [disabled]="!enabled">
      {{pauseButtonLabel}}
    </button>
  </div>
</div>
