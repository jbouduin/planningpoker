<div>
  <button *ngIf="icon; else text" mat-icon-button [matMenuTriggerFor]="languageMenu">
    <mat-icon>language</mat-icon>
  </button>
  <ng-template #text>
    <button mat-raised-button color="primary" [matMenuTriggerFor]="languageMenu">
      {{ currentLanguage }}
    </button>
  </ng-template>
  <mat-menu #languageMenu="matMenu">
    <!-- TODO htmlhint rule id-class-value has been disabled because of the id -->
    <button id="{{ language }}" mat-menu-item *ngFor="let language of languages" (click)="setLanguage(language)">
      {{ language }}
    </button>
  </mat-menu>
</div>
