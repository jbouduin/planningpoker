<h1 mat-dialog-title>{{ title | translate }}</h1>

<mat-dialog-content [formGroup]="formData">
  <mat-form-field>
    <mat-label>{{ nickNameLabel | translate }}</mat-label>
    <input matInput placeholder="{{ nickNamePlaceHolder | translate }}" formControlName="nick" required />
    <mat-error>{{ getErrorMessage('nick') }}</mat-error>
  </mat-form-field>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-button (click)="cancel()">{{ cancelButtonLabel | translate }}</button>
  <button mat-button [mat-dialog-close]="true" [disabled]="formData.invalid" (click)="save()">
    {{ saveButtonLabel | translate }}
  </button>
</div>
