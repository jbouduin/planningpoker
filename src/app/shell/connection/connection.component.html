<div class="connection-wrapper" *ngIf="showConnection" fxLayout="row">
  <mat-icon>{{connectionIcon}}</mat-icon>
  <div class="span-reconnecting" *ngIf="showReconnecting">
    <span>{{reconnectingText}}</span>
    <button class="button-reconnect" mat-stroked-button (click)="reconnect()">
      {{reconnectNowButtonLabel}}
    </button>
  </div>
</div>
