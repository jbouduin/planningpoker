<div>
  <button mat-icon-button [matMenuTriggerFor]="languageMenu" class="language-button">
    <mat-icon>language</mat-icon>
  </button>
  <mat-menu #languageMenu="matMenu">
    <!-- LATER check how to indicate the current language -->
    <button id="{{ language }}" mat-menu-item *ngFor="let language of languages" (click)="setLanguage(language)">
      {{ language }}
    </button>
  </mat-menu>
</div>
