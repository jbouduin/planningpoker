<h1 mat-dialog-title>{{title}}</h1>

<mat-dialog-content [formGroup]="formData">
  <mat-form-field>
    <mat-label>{{nickNameLabel}}</mat-label>
    <input matInput placeholder="{{nickNamePlaceHolder}}" formControlName="nick" required />
    <mat-error>{{ getErrorMessage('nick') }}</mat-error>
  </mat-form-field>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-button (click)="cancel()">{{cancelButtonLabel}}</button>
  <button mat-button [mat-dialog-close]="true" [disabled]="formData.invalid" (click)="save()">{{saveButtonLabel}}</button>
</div>
