<div class="create-join-form-container">
  <mat-card appearance="outlined" [formGroup]="formData">
    <mat-card-title>
      {{ gameHeader | translate }}
    </mat-card-title>

    <mat-card-content>
      <div>
        <mat-form-field>
          <mat-label>{{ TEAM_LABEL | translate }}</mat-label>
          <input
            id="team-input"
            matInput
            placeholder="{{ TEAM_PLACEHOLDER | translate }}"
            formControlName="team"
            required
          />
          <mat-error>{{ getErrorMessage('team') | translate }}</mat-error>
        </mat-form-field>
      </div>
      <div>
        <mat-form-field>
          <mat-label>{{ NICK_LABEL | translate }}</mat-label>
          <input
            id="nick-input"
            matInput
            placeholder="{{ NICK_PLACEHOLDER | translate }}"
            formControlName="nick"
            required
          />
          <mat-error>{{ getErrorMessage('nick') | translate }}</mat-error>
        </mat-form-field>
      </div>
      <div *ngIf="formMode == EFormMode.Create">
        <mat-form-field appearance="fill">
          <mat-label>{{ CARDSET_LABEL | translate }}</mat-label>
          <mat-select formControlName="cardSet">
            <mat-option *ngFor="let cardSet of cardSetValues" [value]="cardSet.set">
              {{ cardSet.label | translate }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div>
        <mat-checkbox id="observe" [(ngModel)]="observer" [ngModelOptions]="{ standalone: true }">
          {{ OBSERVER_LABEL | translate }}
        </mat-checkbox>
      </div>
    </mat-card-content>

    <mat-card-actions class="action-wrapper">
      <button mat-stroked-button color="primary" [disabled]="formData.invalid" (click)="submit()">
        <span>{{ submitButtonLabel | translate }}</span>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
