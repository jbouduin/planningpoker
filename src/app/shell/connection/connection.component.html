<div class="connection-wrapper" *ngIf="showConnection">
  <div class="div-reconnecting" *ngIf="showReconnecting">
    {{reconnectingTextLine1}}<br/>
    {{reconnectingTextLine2}}
  </div>
  <button mat-icon-button class="button-reconnect" (click)="reconnectNow()" disabled="true">
    <mat-icon>{{connectionIcon}}</mat-icon>
  </button>
</div>
