<div class="side-nav-container">
  <!-- Scrum-master -->
  <div id="scrum-master" class="participants">
    <mat-card-title>{{scrumMasterHeader}}</mat-card-title>
    <mat-card-content class="participant-list">
      <session-member [member]="scrumMaster"></session-member>
    </mat-card-content>
  </div>
  <!-- Developers -->
  <div id="developers" class="participants">
    <mat-card-title>{{developersHeader}}</mat-card-title>
    <mat-card-content class="participant-list">
      <div *ngFor="let developer of developers">
        <session-member [member]="developer"></session-member>
      </div>
    </mat-card-content>
  </div>
  <!-- Observers -->
  <div id="observers" class="participants">
    <mat-card-title>{{observersHeader}}</mat-card-title>
    <mat-card-content class="participant-list">
      <div *ngFor="let observer of observers">
        <session-member [member]="observer"></session-member>
      </div>
    </mat-card-content>
  </div>
</div>
