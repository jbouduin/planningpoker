<div class="container">
  <div>
    <img class="logo" src="assets/logo_text_bottom_512x512.png" alt="logo" />
  </div>
  <div class="join-wrapper">
    <div *ngIf="showCreate" class="card-wrapper">
      <home-join id="create-team" [isCreate]="true"></home-join>
    </div>
    <div class="card-wrapper">
      <home-join id="join-team" [isCreate]="false" [teamParam]="teamParam"></home-join>
    </div>
  </div>
</div>
